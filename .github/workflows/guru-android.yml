name: guru-android
on:
  push:
    branches: [main]
    paths: ['guru/**', 'data/curriculum/**', '.github/workflows/guru-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Build web assets, add/sync Android platform
        run: |
          node tools/build-sw-manifest.mjs
          node tools/android-sync.mjs
      - name: Apply permissions and manifest tweaks
        run: node tools/android-patch.mjs
      - name: Assemble debug APK
        working-directory: guru/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: guru-debug-apk
          path: guru/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
